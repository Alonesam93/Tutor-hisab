name: Build Tutor Hisab Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - fix/account-isolation-profile-cancel
  push:
    branches:
      - fix/audit-and-data-integrity
      - fix/white-screen-onboarding
      - fix/account-isolation-profile-cancel
      - fix/ui-navigation-language-branding
      - fix/back-login-polish-2026-11-13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check embedded JavaScript syntax
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("app/src/main/assets/index.html","utf8"); const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()); if(scripts.length!==1) throw new Error(`Expected one inline script, found ${scripts.length}`); fs.writeFileSync("/tmp/tutor-hisab-inline.js",scripts.join("
"));'
          node --check /tmp/tutor-hisab-inline.js

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tutor-hisab-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
