name: Build Tutor Hisab Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/audit-and-data-integrity
      - fix/white-screen-onboarding
      - fix/account-isolation-profile-cancel
      - fix/ui-navigation-language-branding
      - fix/back-login-polish-2026-11-13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check embedded JavaScript and required app flows
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("app/src/main/assets/index.html","utf8"); const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()); if(scripts.length!==1) throw new Error(\`Expected one inline script, found \${scripts.length}\`); fs.writeFileSync("/tmp/tutor-hisab-inline.js",scripts.join("\n"));'
          node --check /tmp/tutor-hisab-inline.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          java = Path("app/src/main/java/com/tutorhisab/app/MainActivity.java").read_text(encoding="utf-8")
          rules = Path("firestore.rules").read_text(encoding="utf-8")
          if r"/^[^\s@]+@[^\s@]+\.[^\s@]+$/" not in html:
              raise SystemExit("Email validation pattern missing")
          if r"/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/" in html:
              raise SystemExit("Email validation contains the double-escape bug")
          for required in ("signInWithEmailAndPassword", "createUserWithEmailAndPassword",
                           "sendPasswordResetEmail", "window.handleAppBack=handleAppBack",
                           'STORAGE_KEY="tutorHisabData_"+u.uid', 'showTab("home",false)'):
              if required not in html:
                  raise SystemExit("Required app flow missing: " + required)
          if "window.handleAppBack ? window.handleAppBack()" not in java:
              raise SystemExit("Android Back button is not connected to the app navigation handler")
          tabs = re.findall(r'data-tab="([^"]+)"', html)
          if tabs != ["home", "store", "notification", "profile", "settings"]:
              raise SystemExit("Bottom navigation must contain the five required tabs in order")
          home_tabs = re.findall(r'data-home-tab="([^"]+)"', html)
          if home_tabs != ["students", "payments", "studentList", "reports"]:
              raise SystemExit("Homepage must contain all four required sections in order")
          if "request.auth.uid == userId" not in rules:
              raise SystemExit("Firestore rules do not enforce per-user ownership")
          PY

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tutor-hisab-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
