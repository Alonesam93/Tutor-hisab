name: Build Tutor Hisab Android APK

concurrency:
  group: tutor-hisab-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - fix/account-isolation-profile-cancel
  push:
    branches:
      - fix/audit-and-data-integrity
      - fix/white-screen-onboarding
      - fix/account-isolation-profile-cancel
      - fix/ui-navigation-language-branding
      - fix/back-login-polish-2026-11-13
      - feat/professional-design-system-2026-11-13
      - fix/auth-profile-guard-and-validation-2026-11-14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check embedded JavaScript syntax
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("app/src/main/assets/index.html","utf8"); const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()); if(scripts.length!==1) throw new Error(`Expected one inline script, found ${scripts.length}`); fs.writeFileSync("/tmp/tutor-hisab-inline.js",scripts.join("\n"));'
          node --check /tmp/tutor-hisab-inline.js

      - name: Test accounting calculations
        run: node .github/scripts/accounting-tests.cjs

      - name: Check Tutor Hisab UI requirements
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          const tabs = [...html.matchAll(/data-tab="(home|store|notification|profile|settings)"/g)].map(m => m[1]);
          assert(tabs.length === 5 && new Set(tabs).size === 5, 'Expected exactly five unique bottom-navigation tabs');
          for (const id of ['homeStudentsPanel','homePaymentsPanel','homeStudentListPanel','homeReportsPanel']) assert(html.includes('id="'+id+'"'), 'Missing Homepage panel: '+id);
          for (const label of ['Homepage','My Store','Notification','My Profile','Settings']) assert(new RegExp('<span class="nav-label">'+label+'</span>').test(html), 'Missing visible bottom-nav label: '+label);
          const storeStart = html.indexOf('id="storeScreen"');
          const storeEnd = html.indexOf('</section>', storeStart);
          const store = html.slice(storeStart, storeEnd);
          for (const label of ['SMS Packages','Pro','Elite','Coming Soon']) assert(store.includes(label), 'Missing Store item/status: '+label);
          assert(!store.includes('Remove Ad'), 'Remove Ad must not appear in My Store');
          assert(html.includes('id="notificationList"') && html.includes('Service status') && html.includes('অ্যাপ আপডেট'), 'Notification screen must include due/payment updates, service status and app updates');
          assert(html.includes('id="notificationCount"') && html.includes('const count=due.length+recent.length'), 'Notification count badge must reflect actual due and payment notifications');
          assert(html.includes('onclick="backup()"') && html.includes('id="restoreFile"'), 'Backup/restore must remain in Settings');
          assert(html.includes('id="loginEmail"') && html.includes('id="loginPassword"') && html.includes('id="confirmPassword"'), 'Email/password authentication fields missing');
          assert(html.includes('prefers-reduced-motion') && html.includes('min-height:48px'), 'Accessibility sizing or reduced-motion support missing');
          assert(html.includes('id="firstNotificationStep"') && html.indexOf('id="firstNotificationStep"') < html.indexOf('id="firstAuthStep"') && !html.includes('id="firstLanguageStep"'), 'First-run flow must go from notification permission directly to sign-in without language selection');
          assert(html.includes('Enable notifications?') && html.includes('Not now'), 'First-run notification permission screen must offer Enable and Not now');
          assert(html.includes('id="firstNotificationContinue"') && html.includes('id="firstNotificationSkip"'), 'Notification permission needs clear continue and skip actions');
          assert(html.includes('requestNotificationPermission') && html.includes('autocomplete="current-password"') && html.includes('autocomplete="new-password"'), 'Permission bridge or password-manager-friendly auth fields missing');
          assert(html.includes('async function emailSignOut()') && html.includes('function editStudent(id)') && html.includes('showHomePanel("students")'), 'Sign out or Student List edit navigation is not wired');
          assert(!html.includes('github.com/Alonesam93/Tutor-hisab/issues') && html.includes('href="contact.html"') && html.includes('href="feedback.html"'), 'Settings support links must open in-app pages, not GitHub');
          assert(html.includes('max-height:calc(100dvh - 24px)') && html.includes('overflow-y:auto'), 'Sign Up card must scroll on short mobile screens');
          for (const page of ['app/src/main/assets/contact.html','app/src/main/assets/feedback.html']) assert(fs.existsSync(page), 'Missing packaged support page: '+page);
          const java = fs.readFileSync('app/src/main/java/com/tutorhisab/app/MainActivity.java', 'utf8');
          const gradle = fs.readFileSync('app/build.gradle', 'utf8');
          assert(gradle.includes('versionCode 6') && gradle.includes("versionName '1.2.3'"), 'Android update version must increase for installation over previous builds');
          assert(java.includes('public void requestNotificationPermission()'), 'Native notification permission bridge missing');
          assert(!/if\s*\(Build\.VERSION\.SDK_INT\s*>=\s*33[\s\S]{0,220}requestPermissions\(/.test(java.slice(java.indexOf('protected void onCreate'), java.indexOf('private void scheduleNextInterstitialWindow'))), 'Notification permission must not be requested immediately during app startup');
          assert(java.includes('shouldOverrideUrlLoading(WebView view, WebResourceRequest request)') && java.includes('appassets.androidplatform.net') && java.includes('startsWith("/assets/")'), 'WebView must keep only packaged HTTPS app assets inside the native bridge');
          assert(java.includes('WebViewAssetLoader') && java.includes('setAllowFileAccess(false)') && java.includes('setAllowUniversalAccessFromFileURLs(false)') && java.includes('setAllowFileAccessFromFileURLs(false)'), 'WebView local file access must be restricted');
          assert(java.includes('webView.loadUrl("https://appassets.androidplatform.net/assets/index.html")') && gradle.includes('androidx.webkit:webkit:1.18.0'), 'App assets must load through the stable AndroidX WebViewAssetLoader');
          assert(java.includes('startLegacyStorageCapture()') && java.includes('saveLegacyStorage(String json)') && java.includes('markLegacyStorageMigrated()'), 'Existing file-origin local data must be migrated before secure WebView startup');
          assert(html.includes('window.AppMigration.getLegacyStorage') && html.includes('markLegacyStorageMigrated'), 'The app must import existing local data before initializing account storage');
          assert(html.includes('tutorHisabMigrationNotice') && html.includes('নতুন অ্যাকাউন্ট খুললে পুরোনো হিসাব দেখা যাবে না।'), 'Users must be told when a one-time sign-in is required after data migration');
          assert(java.includes('file:///android_asset/index.html?legacy-storage-migration') && java.includes("key.indexOf('tutorHisab')===0"), 'Legacy capture must use the exact previous index origin and copy only Tutor Hisab data keys');
          assert(html.includes('location.search!=="?legacy-storage-migration"'), 'Normal app startup must be skipped during legacy data capture');
          console.log('Tutor Hisab UI contract checks passed.');
          NODE

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.tutorhisab.app' versionCode='6' versionName='1.2.3'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tutor-hisab-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
