name: Deploy Tutor Hisab Preview

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to deploy to the preview channel"
        required: true
        default: "fix/audit-and-data-integrity"
        type: string
  push:
    branches:
      - fix/audit-and-data-integrity
      - feature/onboarding-navigation-ui

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || github.ref }}

      - name: Deploy preview only (never live)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUTOR_HISAB }}
          projectId: tutor-hisab
          channelId: tutor-hisab-test
          expires: 7d

      - name: Show preview URL
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
        run: |
          echo "Preview URL: $PREVIEW_URL"
