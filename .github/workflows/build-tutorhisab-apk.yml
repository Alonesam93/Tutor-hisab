name: Build Tutor Hisab Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/final-design-and-core-fixes
    paths:
      - index.html
      - app/**
      - build.gradle
      - settings.gradle
      - firestore.rules
      - .github/workflows/build-tutorhisab-apk.yml

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp hosting/privacy.html app/src/main/assets/privacy.html
          cp hosting/terms.html app/src/main/assets/terms.html
          cp about.html app/src/main/assets/about.html

      - name: Validate required app flows and source synchronization
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          root = Path("index.html").read_text(encoding="utf-8")
          if html != root:
              raise SystemExit("Android HTML asset is not synchronized with root index.html")
          required = [
              "firebase-auth-compat.js",
              "signInWithEmailAndPassword",
              "createUserWithEmailAndPassword",
              "sendPasswordResetEmail",
              "firstNotificationStep",
              "firstLanguageStep",
              "firstAuthStep",
              "tutorHisabData_",
              "deletedStudentIds",
              "deletedPaymentIds",
              "paymentIds=new Set()",
              "function restore()",
              "signupName",
              "signupMobile",
              "signupInstitution",
              "signupDesignation",
              "signupPhotoInput",
              "function syncCloud()",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Required app functionality missing: " + ", ".join(missing))
          nav = re.search(r'<nav class="bottom-nav".*?</nav>', html, re.S)
          if not nav or len(re.findall(r'<button[^>]+data-tab=', nav.group(0))) != 5:
              raise SystemExit("Expected exactly five permanent bottom navigation tabs")
          home = re.search(r'<div class="home-tabs".*?</div>', html, re.S)
          if not home or len(re.findall(r'data-home-tab=', home.group(0))) != 4:
              raise SystemExit("Expected exactly four homepage sections")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/tutor-hisab-inline.js").write_text("\n;\n".join(inline_scripts), encoding="utf-8")
          PY
          node --check /tmp/tutor-hisab-inline.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tutor-Hisab-1.1.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
