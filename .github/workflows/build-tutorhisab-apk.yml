name: Build Tutor Hisab Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/capacitor-debug-apk
      - fix/white-screen-onboarding
    paths:
      - index.html
      - app/**
      - build.gradle
      - settings.gradle
      - .github/workflows/build-tutorhisab-apk.yml

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare current app screens and legal pages
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp hosting/privacy.html app/src/main/assets/privacy.html
          cp hosting/terms.html app/src/main/assets/terms.html
          cp about.html app/src/main/assets/about.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tutor-Hisab-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
