name: Build Tutor Hisab Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/capacitor-debug-apk
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - .github/workflows/build-tutorhisab-apk.yml

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Add resilient Maven mirrors
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("android/build.gradle", "android/settings.gradle"):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace(
                  "mavenCentral()",
                  "mavenCentral()\\n        maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }"
              )
              text = text.replace(
                  "google()",
                  "google()\\n        maven { url 'https://maven.google.com' }"
              )
              path.write_text(text)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tutor-Hisab-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
