<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#51418f"><title>Feedback — Tutor Hisab</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f5f2fa;color:#29243b;font:15px/1.6 Arial,sans-serif}main{max-width:620px;margin:20px auto;padding:24px;background:#fff;border:1px solid #e5def0;border-radius:18px;box-shadow:0 8px 24px #32245f12}h1{color:#51418f;margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}textarea{width:100%;min-height:150px;padding:12px;border:1px solid #d8d0e5;border-radius:10px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#51418f;color:#fff;font-weight:700;font-size:15px;margin-top:14px}a{color:#51418f;font-weight:700;text-decoration:none}.hint{font-size:13px;color:#686178}</style></head>
<body><main><h1>Feedback</h1><p>Tell us what is working well or what should be improved.</p><form id="feedbackForm"><label for="feedbackText">Your feedback</label><textarea id="feedbackText" required maxlength="3000" placeholder="Write your feedback here..."></textarea><button type="submit">Share Feedback</button></form><p id="status" class="hint" role="status"></p><p class="hint">Your feedback is not uploaded automatically. You can share it using your phone's share options.</p><p><a href="index.html">← Back to Tutor Hisab</a></p></main>
<script>document.getElementById("feedbackForm").addEventListener("submit",async function(e){e.preventDefault();const message=document.getElementById("feedbackText").value.trim();if(!message)return;const title="Tutor Hisab Feedback";try{if(window.Share&&typeof window.Share.shareText==="function"){window.Share.shareText(title,message);document.getElementById("status").textContent="Share sheet opened.";return;}if(navigator.share){await navigator.share({title,text:message});document.getElementById("status").textContent="Thank you for your feedback.";}else if(navigator.clipboard){await navigator.clipboard.writeText(message);document.getElementById("status").textContent="Feedback copied. You can paste and send it."; }else{document.getElementById("status").textContent="Please copy your feedback and share it manually.";}}catch(err){document.getElementById("status").textContent="Sharing was cancelled or unavailable. You can copy your feedback manually.";}});</script></body></html>
