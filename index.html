<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f3;color:#18352b;font-family:Arial,sans-serif}
header{background:#087f5b;color:white;padding:20px 15px;text-align:center}
header h2{margin:0 0 6px}
main{max-width:700px;margin:auto;padding:14px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#e4f5ed;padding:13px;border-radius:10px;text-align:center}

.bottom-nav button{font-size:10px;padding:10px 2px;margin:0;border-radius:7px;white-space:normal;min-height:44px}
.bottom-nav button.active{background:#075b43}
body{padding-bottom:75px}

</head>

<div class="stat">মোট বকেয়া<b id="due">৳০</b></div>

<h3 id="studentFormTitle">➕ নতুন শিক্ষার্থী যোগ করুন</h3>
<input id="name" placeholder="শিক্ষার্থীর নাম" maxlength="100">
<input id="className" placeholder="শ্রেণি" maxlength="50">
<input id="phone" placeholder="মোবাইল নম্বর" inputmode="tel" maxlength="20">

<label>কোন মাসের বেতন</label>

<label>জমার তারিখ</label>

<div class="notice">একাধিক মাসের বকেয়া থাকলে নির্বাচিত মাস পর্যন্ত মোট বকেয়ার মধ্যে জমা নেওয়া হবে।</div>

</div>
<div class="card">
<h3>🧾 জমার ইতিহাস</h3>
<div id="paymentHistory">এখনো কোনো জমা নেই।</div>

 </div>

 <div class="card"><h3>🔔 Notification</h3><p>এখনো কোনো নোটিফিকেশন নেই।</p><p class="small">পেমেন্ট রিমাইন্ডার ও অ্যাপ আপডেটের নোটিফিকেশন পরবর্তী ধাপে যুক্ত হবে।</p></div>

<label>নাম</label><input id="profileName" maxlength="100" placeholder="আপনার নাম">
<label>মোবাইল নম্বর</label><input id="profileMobile" maxlength="20" inputmode="tel" placeholder="মোবাইল নম্বর">
<label>প্রতিষ্ঠানের নাম</label><input id="profileInstitution" maxlength="120" placeholder="প্রতিষ্ঠানের নাম">

 <div class="card"><h3>⚙️ Settings</h3>

 </div>

<script>
let STORAGE_KEY="tutorHisabData";
const $=id=>document.getElementById(id);
const money=n=>"৳"+Number(n||0).toLocaleString("bn-BD",{maximumFractionDigits:2});
const today=new Date();
const localDate=[today.getFullYear(),String(today.getMonth()+1).padStart(2,"0"),String(today.getDate()).padStart(2,"0")].join("-");
const currentMonth=localDate.slice(0,7);
function emptyData(){return {students:[],payments:[]};}
function loadData(){
 try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return emptyData();const parsed=JSON.parse(raw);if(!parsed||!Array.isArray(parsed.students)||!Array.isArray(parsed.payments))return emptyData();return parsed;}
 catch(e){return emptyData();}
}
let data=loadData();
let editingStudentId=null;
let editingPaymentId=null;
$("start").value=currentMonth;$("payMonth").value=currentMonth;$("reportMonth").value=currentMonth;$("payDate").value=localDate;
function validMonth(v){return typeof v==="string"&&/^\d{4}-(0[1-9]|1[0-2])$/.test(v);}
function validDate(v){if(typeof v!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split("-").map(Number);const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d;}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));render();}
function monthsBetween(a,b){if(!validMonth(a)||!validMonth(b)||a>b)return 0;const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+m2-m1+1;}
function paidFor(id,month=null){return data.payments.filter(p=>p.studentId===id&&(!month||p.month===month)).reduce((s,p)=>s+Number(p.amount||0),0);}
function dueFor(s,upto=currentMonth){
 const accrued=Number(s.opening||0)+Number(s.fee||0)*monthsBetween(s.start,upto);
 const paid=data.payments.filter(p=>p.studentId===s.id&&validMonth(p.month)&&p.month<=upto).reduce((v,p)=>v+Number(p.amount||0),0);
 return Math.max(0,accrued-paid);
}
function addStudent(){
 const name=$("name").value.trim(),fee=Number($("fee").value),start=$("start").value,opening=Number($("opening").value||0);
 if(!name||!Number.isFinite(fee)||fee<=0||!validMonth(start)){alert("নাম, সঠিক মাসিক বেতন ও শুরুর মাস লিখুন।");return;}
 if(!Number.isFinite(opening)||opening<0){alert("আগের বকেয়া শূন্য বা তার বেশি হতে হবে।");return;}
 if(editingStudentId){
  const old=data.students.find(s=>s.id===editingStudentId);if(!old){alert("শিক্ষার্থীটি পাওয়া যায়নি।");cancelStudentEdit();return;}
  const related=data.payments.filter(p=>p.studentId===editingStudentId);
  const paymentMonths=[...new Set(related.map(p=>p.month))].sort();
  for(const m of paymentMonths){const accrued=opening+fee*monthsBetween(start,m);const paid=related.filter(p=>p.month<=m).reduce((sum,p)=>sum+Number(p.amount||0),0);if(m<start||paid>accrued){alert("নতুন বেতন বা শুরুর মাসের কারণে আগের জমার হিসাব অসামঞ্জস্য হবে। আগের পেমেন্টের হিসাব ঠিক রেখে তথ্য পরিবর্তন করুন।");return;}}
  Object.assign(old,{name,className:$("className").value.trim(),phone:$("phone").value.trim(),fee,start,opening});
  cancelStudentEdit();save();alert("শিক্ষার্থীর তথ্য সম্পাদনা করে সংরক্ষণ করা হয়েছে।");return;
 }
 data.students.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString()+"-"+Math.random().toString(36).slice(2),name,className:$("className").value.trim(),phone:$("phone").value.trim(),fee,start,opening});
 ["name","className","phone","fee"].forEach(id=>$(id).value="");$("opening").value="0";save();
}
function addPayment(){
 const id=$("payStudent").value,amount=Number($("payAmount").value),month=$("payMonth").value,date=$("payDate").value,student=data.students.find(s=>s.id===id);
 if(!student||!Number.isFinite(amount)||amount<=0||!validMonth(month)||!validDate(date)){alert("শিক্ষার্থী, সঠিক জমার পরিমাণ, মাস ও তারিখ দিন।");return;}
 if(month<student.start){alert("শিক্ষার্থীর বেতন গণনা শুরুর মাসের আগের মাসে জমা নেওয়া যাবে না।");return;}
 const otherPayments=data.payments.filter(p=>p.studentId===id&&p.id!==editingPaymentId&&validMonth(p.month)&&p.month<=month).reduce((sum,p)=>sum+Number(p.amount||0),0);
 const accrued=Number(student.opening||0)+Number(student.fee||0)*monthsBetween(student.start,month);
 const outstanding=Math.max(0,accrued-otherPayments);
 if(outstanding<=0){alert("নির্বাচিত মাস পর্যন্ত কোনো বকেয়া নেই।");return;}
 if(amount>outstanding){alert("এই মাস পর্যন্ত অবশিষ্ট বকেয়া "+money(outstanding)+"। এর বেশি জমা নেওয়া যাবে না।");return;}
 if(editingPaymentId){const old=data.payments.find(p=>p.id===editingPaymentId);if(!old){cancelPaymentEdit();alert("জমার তথ্য পাওয়া যায়নি।");return;}Object.assign(old,{studentId:id,amount,month,date});cancelPaymentEdit();save();alert("জমার তথ্য সম্পাদনা হয়েছে।");return;}
 data.payments.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),studentId:id,amount,month,date});
 $("payAmount").value="";save();alert("জমা সংরক্ষণ হয়েছে।");
}
function editStudent(id){
 const s=data.students.find(x=>x.id===id);if(!s)return;
 editingStudentId=id;$("name").value=s.name;$("className").value=s.className||"";$("phone").value=s.phone||"";$("fee").value=s.fee;$("start").value=s.start;$("opening").value=Number(s.opening||0);
 $("studentFormTitle").textContent="✏️ শিক্ষার্থীর তথ্য সম্পাদনা করুন";$("studentSaveBtn").textContent="পরিবর্তন সংরক্ষণ করুন";$("studentCancelBtn").style.display="block";
 $("name").scrollIntoView({behavior:"smooth",block:"center"});
}
function cancelStudentEdit(){editingStudentId=null;["name","className","phone","fee"].forEach(id=>$(id).value="");$("opening").value="0";$("studentFormTitle").textContent="➕ নতুন শিক্ষার্থী যোগ করুন";$("studentSaveBtn").textContent="শিক্ষার্থী সংরক্ষণ করুন";$("studentCancelBtn").style.display="none";}
function removeStudent(id){if(!confirm("শিক্ষার্থী ও তার পেমেন্টের তথ্য মুছে ফেলবেন?"))return;data.students=data.students.filter(s=>s.id!==id);data.payments=data.payments.filter(p=>p.studentId!==id);save();}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 const totalPaid=data.payments.reduce((s,p)=>s+Number(p.amount||0),0),totalDue=data.students.reduce((s,p)=>s+dueFor(p),0);
 $("count").textContent=data.students.length.toLocaleString("bn-BD");$("paid").textContent=money(totalPaid);$("due").textContent=money(totalDue);$("monthly").textContent=money(data.students.reduce((s,p)=>s+Number(p.fee||0),0));
 $("students").innerHTML=data.students.length?data.students.map(s=>`
 <div class="student"><b>${esc(s.name)}</b> <span class="small">${esc(s.className||"")}</span>
 <div class="small">মোবাইল: ${esc(s.phone||"নেই")}</div><div>মাসিক বেতন: ${money(s.fee)}</div><div>মোট জমা: ${money(paidFor(s.id))}</div>
 <div><b>বর্তমান বকেয়া: ${money(dueFor(s))}</b></div><div class="small">হিসাব শুরুর মাস: ${esc(s.start)} | আগের বকেয়া: ${money(s.opening)}</div>
 <button class="secondary" data-edit-id="${esc(s.id)}">সম্পাদনা</button><button class="danger" data-remove-id="${esc(s.id)}">শিক্ষার্থী মুছুন</button></div>`).join(""):"এখনো কোনো শিক্ষার্থী যোগ করা হয়নি।";
 $("payStudent").innerHTML='<option value="">শিক্ষার্থী নির্বাচন করুন</option>'+data.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
 const history=[...data.payments].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 $("paymentHistory").innerHTML=history.length?history.map(p=>{const st=data.students.find(s=>s.id===p.studentId);return '<div class="student"><b>'+esc(st?st.name:"শিক্ষার্থী নেই")+'</b><div>পরিমাণ: '+money(p.amount)+' | মাস: '+esc(p.month)+' | তারিখ: '+esc(p.date)+'</div><button class="secondary" data-payment-edit="'+esc(p.id)+'">জমা সম্পাদনা</button><button class="danger" data-payment-remove="'+esc(p.id)+'">জমা মুছুন</button></div>';}).join(""):"এখনো কোনো জমা নেই।";
}
$("students").addEventListener("click",e=>{const editBtn=e.target.closest("[data-edit-id]");if(editBtn){editStudent(editBtn.dataset.editId);return;}const btn=e.target.closest("[data-remove-id]");if(btn)removeStudent(btn.dataset.removeId);});
$("paymentHistory").addEventListener("click",e=>{const edit=e.target.closest("[data-payment-edit]");if(edit){editPayment(edit.dataset.paymentEdit);return;}const del=e.target.closest("[data-payment-remove]");if(del)removePayment(del.dataset.paymentRemove);});
function editPayment(id){const p=data.payments.find(x=>x.id===id);if(!p)return;editingPaymentId=id;$("payStudent").value=p.studentId;$("payAmount").value=p.amount;$("payMonth").value=p.month;$("payDate").value=p.date;const btn=document.querySelector('button[onclick="addPayment()"]');if(btn)btn.textContent="জমার পরিবর্তন সংরক্ষণ করুন";$("payStudent").scrollIntoView({behavior:"smooth",block:"center"});}
function cancelPaymentEdit(){editingPaymentId=null;$("payAmount").value="";$("payMonth").value=currentMonth;$("payDate").value=localDate;const btn=document.querySelector('button[onclick="addPayment()"]');if(btn)btn.textContent="জমা সংরক্ষণ করুন";}
function removePayment(id){if(!confirm("এই জমার তথ্য মুছে ফেলবেন?"))return;data.payments=data.payments.filter(p=>p.id!==id);if(editingPaymentId===id)cancelPaymentEdit();save();}
function report(){
 const m=$("reportMonth").value;if(!validMonth(m)){alert("সঠিক মাস নির্বাচন করুন");return;}
 const rows=data.students.map(s=>({name:s.name,paid:paidFor(s.id,m),due:dueFor(s,m)}));
 $("reportResult").innerHTML=rows.map(r=>`<hr><b>${esc(r.name)}</b><br>এই মাসে জমা: ${money(r.paid)}<br>এই মাস পর্যন্ত মোট বকেয়া: ${money(r.due)}`).join("")||"কোনো তথ্য নেই";
}
function backup(){
 if(window.Android && typeof window.Android.saveBackup==="function"){window.Android.saveBackup(JSON.stringify(data,null,2));return;}
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="tutor-hisab-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function restore(){
 const file=$("restoreFile").files[0];if(!file){alert("ব্যাকআপ ফাইল নির্বাচন করুন");return;}
 const reader=new FileReader();reader.onload=()=>{
  try{
   const d=JSON.parse(reader.result);if(!d||!Array.isArray(d.students)||!Array.isArray(d.payments))throw Error("invalid");
   const ids=new Set();
   for(const s of d.students){if(!s||typeof s.id!=="string"||!s.id||ids.has(s.id)||typeof s.name!=="string"||!s.name.trim()||!validMonth(s.start)||!Number.isFinite(Number(s.fee))||Number(s.fee)<=0||!Number.isFinite(Number(s.opening||0))||Number(s.opening||0)<0)throw Error("student");ids.add(s.id);}
   for(const p of d.payments){const student=d.students.find(s=>s.id===p.studentId);if(!p||typeof p.studentId!=="string"||!ids.has(p.studentId)||!Number.isFinite(Number(p.amount))||Number(p.amount)<=0||!validMonth(p.month)||!validDate(p.date)||p.month<student.start)throw Error("payment");}
   for(const s of d.students){const months=[...new Set(d.payments.filter(p=>p.studentId===s.id).map(p=>p.month))].sort();for(const m of months){const accrued=Number(s.opening||0)+Number(s.fee)*monthsBetween(s.start,m);const paid=d.payments.filter(p=>p.studentId===s.id&&p.month<=m).reduce((sum,p)=>sum+Number(p.amount),0);if(paid>accrued)throw Error("overpaid");}}
   if(!confirm("বর্তমান তথ্যের জায়গায় ব্যাকআপের তথ্য বসবে। চালিয়ে যাবেন?"))return;
   data=d;save();alert("ব্যাকআপ রিস্টোর হয়েছে।");
  }catch(e){alert("ব্যাকআপ ফাইলটি সঠিক নয় বা এতে ভুল তথ্য আছে।");}
 };reader.readAsText(file);
}

function applyLanguage(){
 const lang=localStorage.getItem("tutorHisabLanguage")||"bn";
 document.documentElement.lang=lang;
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){const raw=node.nodeValue,trimmed=raw.trim();if(!trimmed)continue;const translated=lang==="en"?translations[trimmed]:reverseTranslations[trimmed];if(translated)node.nodeValue=raw.replace(trimmed,translated);}
 document.querySelectorAll("[placeholder]").forEach(el=>{const original=el.dataset.bnPlaceholder||el.getAttribute("placeholder");if(!el.dataset.bnPlaceholder)el.dataset.bnPlaceholder=original;el.setAttribute("placeholder",lang==="en"?(translations[original]||original):original);});
 const select=document.getElementById("languageSelect");if(select&&select.value!==lang)select.value=lang;
}
const reverseTranslations=Object.fromEntries(Object.entries(translations).map(([bn,en])=>[en,bn]));
const originalRender=render;
render=function(){originalRender();applyLanguage();};
document.addEventListener("change",e=>{if(e.target&&e.target.id==="languageSelect"){localStorage.setItem("tutorHisabLanguage",e.target.value);applyLanguage();}});

 const home=$("homeScreen");
 const screens={store:$("storeScreen"),notification:$("notificationScreen"),profile:$("profileScreen"),settings:$("settingsScreen")};

 Object.entries(screens).forEach(([key,el])=>{el.hidden=key!==tab;});
 document.querySelectorAll(".bottom-nav button").forEach(btn=>btn.classList.toggle("active",btn.dataset.tab===tab));
 window.scrollTo(0,0);
}

 const btn=e.target.closest("[data-tab]");if(btn)showTab(btn.dataset.tab);
});

async function emailSignUp(){if(!auth){alert("Firebase সংযোগ পাওয়া যায়নি।");return;}const e=$("authEmail").value.trim(),p=$("authPassword").value;if(!e||p.length<6){alert("সঠিক ইমেইল ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।");return;}try{const u=await auth.createUserWithEmailAndPassword(e,p);await db.collection("users").doc(u.user.uid).set({email:u.user.email,profile:profileValues(),createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});authMessage("অ্যাকাউন্ট তৈরি হয়েছে।");}catch(x){alert("অ্যাকাউন্ট তৈরি হয়নি: "+x.message);}}

async function readCloudData(uid){const base=db.collection("users").doc(uid),r=await Promise.all([base.get(),base.collection("students").get(),base.collection("payments").get()]),v=r[0].exists?r[0].data():{};return{students:r[1].docs.map(x=>({id:x.id,...x.data()})),payments:r[2].docs.map(x=>({id:x.id,...x.data()})),profile:v.profile||{}};}
async function writeCloudData(uid,d){
 const base=db.collection("users").doc(uid);
 const [oldS,oldP]=await Promise.all([base.collection("students").get(),base.collection("payments").get()]);
 const ops=[];
 oldS.docs.forEach(x=>ops.push({ref:x.ref,del:true}));
 oldP.docs.forEach(x=>ops.push({ref:x.ref,del:true}));
 d.students.forEach(x=>ops.push({ref:base.collection("students").doc(String(x.id)),data:x}));
 d.payments.forEach(x=>ops.push({ref:base.collection("payments").doc(String(x.id)),data:x}));
 for(let i=0;i<ops.length;i+=400){
  const batch=db.batch();
  ops.slice(i,i+400).forEach(op=>op.del?batch.delete(op.ref):batch.set(op.ref,op.data));
  await batch.commit();
 }
 await base.set({email:currentUser?.email||"",profile:profileValues(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
}
async function saveProfile(){if(!currentUser){alert("আগে Sign In করুন।");return;}try{await db.collection("users").doc(currentUser.uid).set({profile:profileValues(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});authMessage("প্রোফাইল সংরক্ষণ হয়েছে।");}catch(e){cloudMessage("প্রোফাইল সংরক্ষণ হয়নি: "+e.message);}}
async function syncCloud(){if(!currentUser){alert("আগে Sign In করুন।");return;}cloudMessage("Cloud-এর তথ্য যাচাই হচ্ছে…");try{const cloud=await readCloudData(currentUser.uid),local=JSON.parse(JSON.stringify(data)),lh=local.students.length||local.payments.length,ch=cloud.students.length||cloud.payments.length;if(lh&&ch){if(confirm("এই ডিভাইসের তথ্য Cloud-এ আপলোড করবেন? এতে Cloud-এর আগের তথ্য প্রতিস্থাপিত হবে। OK=Upload, Cancel=Cloud থেকে আনুন।")){await writeCloudData(currentUser.uid,local);cloudMessage("Cloud-এ সংরক্ষণ হয়েছে।");}else if(confirm("Cloud-এর তথ্য এই ডিভাইসে আনবেন? বর্তমান তথ্য প্রতিস্থাপিত হবে।")){data={students:cloud.students,payments:cloud.payments};save();cloudMessage("Cloud-এর তথ্য এসেছে।");}else cloudMessage("Sync বাতিল হয়েছে।");}else if(lh){await writeCloudData(currentUser.uid,local);cloudMessage("ডিভাইসের তথ্য Cloud-এ সংরক্ষণ হয়েছে।");}else if(ch){data={students:cloud.students,payments:cloud.payments};save();cloudMessage("Cloud-এর তথ্য এই ডিভাইসে এসেছে।");}else{await writeCloudData(currentUser.uid,local);cloudMessage("Cloud Sync প্রস্তুত।");}}catch(e){cloudMessage("Cloud Sync হয়নি: "+e.message);}}
if(auth){auth.onAuthStateChanged(async u=>{currentUser=u||null;if(u){const guest=data;STORAGE_KEY="tutorHisabData_"+u.uid;const saved=localStorage.getItem(STORAGE_KEY);data=saved?loadData():guest;if(!saved)save();else render();authMessage("Sign In: "+u.email);try{const cloud=await readCloudData(u.uid);$("profileName").value=cloud.profile.name||"";$("profileMobile").value=cloud.profile.mobile||"";$("profileInstitution").value=cloud.profile.institution||"";$("profileDesignation").value=cloud.profile.designation||"";await syncCloud();}catch(e){cloudMessage("Cloud তথ্য পড়া যায়নি: "+e.message);}}else{currentUser=null;STORAGE_KEY="tutorHisabData";data=loadData();render();authMessage("Sign In করা নেই।");cloudMessage("Cloud Sync করতে Sign In করুন।");}});}else{authMessage("Firebase SDK পাওয়া যায়নি।");}
